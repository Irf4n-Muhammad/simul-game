<div id="app">
  <canvas id="scene" aria-label="Your creature in its room. Tap to poke, swipe to change room."></canvas>
  <div class="fade" id="fade"></div>
  <div class="wx" id="wx" aria-hidden="true"></div>

  <div class="hud-top">
    <div class="row">
      <button class="pill" id="famBtn" aria-label="Family">
        <span class="face" id="face"></span>
        <span><b id="nameLbl">...</b><small id="ageLbl"></small><span class="daybar"><i id="dayBar"></i></span></span>
      </button>
      <div style="display: flex; gap: 8px">
        <button class="icon-btn" id="townBtn" aria-label="Go to town">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10l5-4 5 4v11M15 21v-7h4v7M9 21v-4h2v4"/></svg>
        </button>
        <button class="icon-btn" id="planBtn" aria-label="Daily plan">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" fill="none"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        </button>
        <button class="icon-btn" id="lifeBtn" aria-label="Phone">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 18.5h3"/></svg>
        </button>
        <button class="icon-btn" id="diaryBtn" aria-label="Diary">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z" fill="none"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M10 8h5"/></svg>
        </button>
      </div>
    </div>
    <div class="needs" id="needs"></div>
    <div class="care" id="careStrip" hidden></div>
    <button class="today" id="today" hidden><i id="todayIc"></i><span id="todayTx"></span></button>
    <button class="today soon" id="soon" hidden><i id="soonIc"></i><span id="soonTx"></span></button>
    <button class="today soon someday" id="someday" hidden><i id="somedayIc"></i><span id="somedayTx"></span></button>
    <button class="moment" id="momentPill" hidden></button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="flash" id="flash"></div>
  <div class="hint" id="hint">Tap to poke · swipe to change room</div>
  <div id="floats"></div>
  <div class="town-ui" id="townUI" hidden>
    <div class="hood-chip" id="hoodName">Old Town</div>
    <button class="town-q" id="townQ" aria-label="How the town works">?</button>
    <div class="town-bottom">
      <span class="town-hint">Drag to walk the street · tap a house</span>
      <button class="big" id="homeBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4Z"/><path d="M10 20v-5h4v5"/></svg>Back home</button>
    </div>
  </div>

  <div class="hud-bottom" id="bottom">
    <div>
      <button class="coin-chip" id="coinBtn" hidden></button>
      <div class="room-nav">
        <button class="arrow" id="prev" aria-label="Previous room"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="room-name" id="roomName">Kitchen</div>
        <button class="arrow" id="next" aria-label="Next room"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="actions">
      <button class="round talk" id="talkBtn" aria-label="Talk"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4Z"/></svg></button>
      <button class="big" id="actBtn">Feed</button>
      <button class="round dice" id="diceBtn" aria-label="Today's dice">?</button>
    </div>
  </div>

  <div class="talk-topic" id="talkTopic" hidden></div>
  <form class="talkbar" id="talkbar" hidden>
    <button type="button" class="x" id="talkClose" aria-label="Close chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <label class="sr" for="talkIn">Say something</label>
    <input id="talkIn" placeholder="Say something..." autocomplete="off" maxlength="300">
    <button class="send" id="talkSend" aria-label="Send"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
  </form>
  <div class="quota" id="quota" hidden></div>

  <div class="sheet-wrap" id="sheet" hidden></div>
</div>
