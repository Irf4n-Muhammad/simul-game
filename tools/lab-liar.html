<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<!-- v79: lab wilayah liar (liar.js). ?zone=pasir|hutan &view=hero|wide|temple|night (hutan: hero|wide|giant|night) -->
<canvas id="c" style="width:1200px;height:760px"></canvas>
<script src="../lib/three.min.js"></script><script src="../look.js"></script><script src="../liar.js"></script>
<script>
const Q=new URLSearchParams(location.search), zone=Q.get('zone')||'pasir', forest=zone==='hutan', view=Q.get('view')||'hero', night=view==='night';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(1);renderer.setSize(Q.get('perf')?1200:2400,Q.get('perf')?760:1520,false);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const M=(c,o={})=>{const m=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0,envMapIntensity:0.45},o));m.color.convertSRGBToLinear();if(o.emissive!==undefined)m.emissive.convertSRGBToLinear();return m;};
function canvasTex(draw,w=256,h=256,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(rx!==1||ry!==1){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);}return t;}
const scene=new THREE.Scene();
// langit: gradasi di kubah besar
const skyC=forest?(night?['#060d18','#14232c','#1c2c2c']:['#8fc0d8','#cfe4dc','#b8d4a6']):night?['#0e1630','#2a3358','#5a4a5e']:['#8fb9de','#cfe0ec','#f6dfb6'];
const skyT=canvasTex((g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,skyC[0]);gr.addColorStop(0.55,skyC[1]);gr.addColorStop(1,skyC[2]);g.fillStyle=gr;g.fillRect(0,0,w,h);},16,256);
scene.background=skyT;
scene.fog=forest?new THREE.Fog(night?0x14232a:0xa9c7a4,18,150):new THREE.Fog(night?0x5a4a5e:0xf3dcb4,70,300);
const hemi=new THREE.HemisphereLight(0xfff4e6,0x8a6a48,0.5), sun=new THREE.DirectionalLight(night?0x9fb4e8:0xffe6c4,night?0.35:1.6);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.05;Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:300});
scene.add(hemi,sun,sun.target);
const L=Liar.create({THREE,M,canvasTex}), Z=forest?L.hutan({night}):L.pasir({storm:!night});
scene.add(Z.group); if(Z.stars)Z.stars.visible=night;
if(night&&!forest){ const moon=new THREE.Mesh(new THREE.CircleGeometry(9,32),new THREE.MeshBasicMaterial({color:0xf6f0dc,fog:false})); moon.position.set(-120,150,-300); moon.lookAt(0,0,0); scene.add(moon); }
// makhluk kecil buat skala (bentuk sama dengan warga kota)
const crit=new THREE.Group(), fur=M(0xf1e3cf,{roughness:0.95});
const body=new THREE.Mesh(new THREE.SphereGeometry(0.32,20,14),fur);body.position.y=0.36;body.scale.set(1,0.95,0.88);crit.add(body);
for(const sx of [-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,8),fur);e.position.set(sx*0.2,0.62,0);crit.add(e);const ey=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,6),M(0x231c1a,{roughness:0.2}));ey.position.set(sx*0.1,0.42,0.27);crit.add(ey);}
crit.traverse(o=>{if(o.isMesh)o.castShadow=true;});const cs=new THREE.Mesh(new THREE.CircleGeometry(0.34,20).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.22,depthWrite:false}));cs.position.y=0.02;crit.add(cs);
const views={
  hero:{cam:[3.2,2.0,9.5],look:[6,2.6,-30],crit:[1.6,0,4.2],cr:0.5,sun:[-40,80,30]},
  wide:{cam:[-40,34,70],look:[5,2,-30],crit:[1.6,0,4.2],cr:2.6,sun:[-80,60,30]},
  temple:{cam:[12,6,-20],look:[22,5,-46],crit:[16,0,-27],cr:0.2,sun:[-50,40,20]},
  night:{cam:[3.2,2.0,9.5],look:[6,3.5,-30],crit:[1.6,0,4.2],cr:0.5,sun:[-60,60,-40]},
};
if(forest)Object.assign(views,{
  hero:{cam:[1.2,2.0,14],look:[0,9,-38],crit:[0.4,0,7.5],cr:0.3,sun:[-30,80,20]},
  wide:{cam:[-34,62,44],look:[2,0,-30],crit:[0.4,0,7.5],cr:2.6,sun:[-60,70,20]},
  giant:{cam:[6,3.4,-6],look:[0,7,-40],crit:[-2.4,0,-30],cr:2.2,sun:[-30,80,10]},
  night:{cam:[1.2,2.2,14],look:[0,6,-38],crit:[0.4,0,7.5],cr:0.3,sun:[-40,60,-30]},
});
const V=views[view]; crit.position.set(V.crit[0],Z.height(V.crit[0],V.crit[2]),V.crit[2]); crit.rotation.y=V.cr; crit.scale.setScalar(1.6); scene.add(crit);
if(night){const lan=new THREE.PointLight(0xffc98a,1.4,8);lan.position.set(V.crit[0]+0.6,crit.position.y+1.3,V.crit[2]);scene.add(lan);const lm=new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8),new THREE.MeshBasicMaterial({color:0xffe2a8}));lm.position.copy(lan.position);scene.add(lm);}
const cam=new THREE.PerspectiveCamera(40,1200/760,0.3,900);cam.position.set(...V.cam);cam.lookAt(...V.look);
sun.position.set(V.crit[0]+V.sun[0],V.sun[1],V.crit[2]+V.sun[2]);sun.target.position.set(V.crit[0],0,V.crit[2]-15);
const Lk=Look.create(THREE);Lk.apply(night?'night':'day','clear',hemi,sun);if(night){hemi.color.setHex(0x5d6d9e);hemi.groundColor.setHex(0x3a3440);hemi.intensity=0.55;}Lk.patchScene(scene);if(forest&&night){hemi.color.setHex(0x3d5a66);hemi.groundColor.setHex(0x1a2420);hemi.intensity=0.5;}
Z.update(20000);
renderer.render(scene,cam);renderer.info.autoReset=false;renderer.info.reset();renderer.render(scene,cam);
window.RES={view,calls:renderer.info.render.calls,tris:renderer.info.render.triangles};document.title='done';
</script></body></html>
