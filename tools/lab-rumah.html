<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:linear-gradient(#cfe0ee,#efe6d8)}canvas{display:block}</style></head><body>
<canvas id="c" width="2400" height="1520" style="width:1200px;height:760px"></canvas>
<script src="../lib/three.min.js"></script><script src="../lib/RoundedBoxGeometry.js"></script><script src="../lib/RoomEnvironment.js"></script><script src="../lib/GLTFLoader.js"></script>
<script src="../brands.js"></script><script src="../town-assets.js"></script><script src="../kota.js"></script><script src="../look.js"></script><script src="../town.js"></script><script src="../rumah.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(1);renderer.setSize(1200*(new URLSearchParams(location.search).get("mode")==="show"?2:1),760*(new URLSearchParams(location.search).get("mode")==="show"?2:1),false);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.9;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const env0=new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(),0.04).texture;
const M=(c,o={})=>{const m=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0,envMapIntensity:0.45},o));m.color.convertSRGBToLinear();if(o.emissive!==undefined)m.emissive.convertSRGBToLinear();return m;};
const F=(c,o={})=>{const m=new THREE.MeshBasicMaterial(Object.assign({color:c},o));m.color.convertSRGBToLinear();return m;};
const RB=(w,h,d,r=0.08,s=3)=>new THREE.RoundedBoxGeometry(w,h,d,s,r);
const SPH=(r,w=32,h=24)=>new THREE.SphereGeometry(r,w,h);const CYL=(a,b,h,n=32,...x)=>new THREE.CylinderGeometry(a,b,h,n,...x);
function canvasTex(draw,w=256,h=256,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;if(rx!==1||ry!==1){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);}return t;}
const PAINTS=[["Cream",0xefe6d6],["Sand",0xd9c7ae],["Sage",0xc9d1c6],["Blush",0xe3cfc4],["Slate",0xb9c0c6]];
const T=Town.create({THREE,renderer,canvas,M,F,RB,SPH,CYL,canvasTex,environment:env0,getLit:()=>({env:0.6}),getPeriod:()=>'day',bgColor:()=>'#e8e0d4',getWeather:()=>'clear',PAINTS,now:()=>0});
const scene=new THREE.Scene();scene.environment=env0;
const hemi=new THREE.HemisphereLight(0xfff4e6,0x6e5e52,0.4);const sun=new THREE.DirectionalLight(0xffeedb,1.3);
sun.position.set(-4,8,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});scene.add(hemi,sun);
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(40,40),M(0xa9b483,{roughness:1}));gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);
const cam=new THREE.PerspectiveCamera(30,1200/760,0.1,100);cam.position.set(2.2,5.2,10.5);cam.lookAt(0,1.0,0);

const Q=new URLSearchParams(location.search), mode=Q.get('mode')||'show', N=+(Q.get('n')||300);
const R=Rumah.create({THREE,M,RB,canvasTex});
const winM=M(0x8c9aa3,{roughness:0.2});
const pal=[[0xefe6d6,0xc2704f],[0xc9d1c6,0x8a5a44],[0xe3cfc4,0x6d6460],[0xd9c7ae,0x9b6b52],[0xb9c0c6,0x5f6b72]];
const rng=s=>()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
function done(){ if(globalThis.Look){const L=Look.create(THREE);L.apply('day','clear',hemi,sun);L.patchScene(scene);} 
  renderer.render(scene,cam); renderer.info.autoReset=false; renderer.info.reset(); renderer.render(scene,cam);
  const calls=renderer.info.render.calls, tris=renderer.info.render.triangles; renderer.info.autoReset=true;
  const t0=performance.now(); for(let i=0;i<10;i++) renderer.render(scene,cam); renderer.getContext().finish(); const ms=(performance.now()-t0)/10;
  document.title='done'; window.RES={mode,N,calls,tris,ms:Math.round(ms*10)/10}; }
if(mode==='show'){
  cam.position.set(1.6,2.9,6.2); cam.lookAt(0,0.9,0); sun.position.set(-4,8,7);
  [0,1,2].forEach(i=>{const [w,rf]=pal[[0,2,1][i]];const h=R.hi(w,rf,rng(7+i*13),winM);h.position.x=(i-1)*3.4;h.rotation.y=-0.3;scene.add(h);});
  done();
} else {
  const side=Math.ceil(Math.sqrt(N)); gnd.scale.set(8,8,1);
  cam.position.set(0,90,95); cam.lookAt(0,0,0); cam.far=400; cam.updateProjectionMatrix();
  Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,far:300}); sun.position.set(-40,80,50);
  const pos=i=>[(i%side-side/2)*4.2,(Math.floor(i/side)-side/2)*4.2];
  if(mode==='inst'){ const base=R.hi(pal[0][0],pal[0][1],rng(5),winM); const m4=new THREE.Matrix4();
    base.children.forEach(ch=>{const im=new THREE.InstancedMesh(ch.geometry,ch.material,N); im.castShadow=im.receiveShadow=true; for(let i=0;i<N;i++){const [x,z]=pos(i); m4.makeRotationY((i%4)*Math.PI/2); m4.setPosition(x,0,z); im.setMatrixAt(i,m4);} scene.add(im);});
  } else for(let i=0;i<N;i++){ const [w,rf]=pal[i%5]; const h= mode==='old'? (()=>{const g=R.lo(w,rf,winM);return g;})() : R.hi(w,rf,rng(i+1),winM,mode==='raw'); const [x,z]=pos(i); h.position.set(x,0,z); h.rotation.y=(i%4)*Math.PI/2; scene.add(h);} 
  done();
}
</script></body></html>
