# Setiap push dan pull request: lint + tes + build situs + build rilis (periksa saja).
# Hanya push ke main yang menerbitkan ke GitHub Pages: build rilis (_release/, tanpa Dev tools) di akar situs,
# build lengkap (_site/, Dev tools di balik ?dev=1) di /dev/. Keduanya satu origin, jadi save-nya sama.
name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:release
      # Susun folder Pages: rilis di akar, build lengkap di dev/.
      - run: |
          rm -rf _pages && mkdir -p _pages/dev
          cp -R _release/. _pages/
          cp -R _site/. _pages/dev/
          test -f _pages/index.html && test -f _pages/dev/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
